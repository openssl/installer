name: Test Installer

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build MSI (${{ matrix.openssl-ref }})
    runs-on: windows-2025
    env:
      # VS 2022 Enterprise and Strawberry Perl are preinstalled on windows-2025.
      VCVARS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
      # All currently-tested OpenSSL refs pair with the same NIST-validated
      # FIPS module (3.1.2). Pulled in as a sibling 'openssl-fips' checkout.
      FIPS_REF: openssl-3.1.2
    strategy:
      fail-fast: false
      matrix:
        openssl-ref: [openssl-3.5, master]
    steps:
      - name: Checkout installer
        uses: actions/checkout@v6

      - name: Checkout OpenSSL (${{ matrix.openssl-ref }})
        uses: actions/checkout@v6
        with:
          repository: openssl/openssl
          ref: ${{ matrix.openssl-ref }}
          path: openssl

      - name: Checkout OpenSSL for FIPS (${{ env.FIPS_REF }})
        uses: actions/checkout@v6
        with:
          repository: openssl/openssl
          ref: ${{ env.FIPS_REF }}
          path: openssl-fips

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Build OpenSSL
        shell: cmd
        working-directory: openssl
        run: |
          call "%VCVARS%"
          perl Configure VC-WIN64A enable-fips no-makedepend -DOSSL_WINCTX=OpenSSLProject
          nmake /S
          nmake build_docs

      - name: Build OpenSSL (FIPS source)
        shell: cmd
        working-directory: openssl-fips
        run: |
          call "%VCVARS%"
          perl Configure VC-WIN64A enable-fips no-makedepend
          nmake /S

      - name: Build MSI
        uses: caphyon/advinst-github-action@main
        with:
          advinst-version: '23.5.1'
          advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}
          advinst-enable-automation: 'true'
          aip-path: ${{ github.workspace }}\windows-installer\openssl.aip
          aip-build-name: DefaultBuild

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.openssl-ref }}
          path: build-target/Installer64/DefaultBuild/*.msi
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.openssl-ref }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        openssl-ref: [openssl-3.5, master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: msi-${{ matrix.openssl-ref }}
          path: build

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen || uv sync

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem build -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw "No MSI found in build/" }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pytest
        run: uv run pytest tests --installer "${{ steps.msi.outputs.path }}" -v
