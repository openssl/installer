# Test-suite configuration. Consumed by tests/conftest.py and the test files
# under tests/. The CI matrix (which OpenSSL refs to build/test) lives directly
# in .github/workflows/test-installer.yml.

fips:
  # The current validated module
  validated_versions: "3.1.2"

paths:
  install_root: 'C:\Program Files\OpenSSL Library'

registry:
  # Two key paths the installer writes; the second uses Wow6432Node directly
  # (without an "OpenSSL Corporation" subkey) — matches the existing layout.
  # Placeholders: {registry_version} = "<major>.<minor>" (e.g. "4.0").
  paths:
    - 'SOFTWARE\OpenSSL Corporation\OpenSSL-{registry_version}-OpenSSLProject'
    - 'SOFTWARE\Wow6432Node\OpenSSL-{registry_version}-OpenSSLProject'
  values:
    # Expected REG_SZ values under each path. Paths are compared
    # case-insensitively on the drive letter and exactly on the rest.
    MODULESDIR: '{install_dir}\lib\ossl-modules'
    OPENSSLDIR: '{install_dir}\config'
    EnvPath:    '{install_dir}\bin\'

# Expected files. Keys are directories relative to {install_dir}; "" is the root.
# Each entry's `flags` indicates which install configurations include it:
#   all, app, sdk, fips, fips_sdk
# Placeholders in `name`: {major}, {minor}, {patch}
files:
  "":
    - { name: LICENSE.txt, flags: all }
    - { name: version.dat, flags: all }
  "bin":
    - { name: openssl.exe,                 flags: app }
    - { name: "libcrypto-{major}-x64.dll", flags: app }
    - { name: "libssl-{major}-x64.dll",    flags: app }
  "lib":
    - { name: "libcrypto-{major}-x64.dll", flags: sdk }
    - { name: "libssl-{major}-x64.dll",    flags: sdk }
    - { name: "libcrypto-{major}-x64.pdb", flags: sdk }
    - { name: "libssl-{major}-x64.pdb",    flags: sdk }
    - { name: libcrypto.lib,               flags: sdk }
    - { name: libssl.lib,                  flags: sdk }
    - { name: libcrypto_static.lib,        flags: sdk }
    - { name: libssl_static.lib,           flags: sdk }
  "lib/ossl-modules":
    - { name: fips.dll,   flags: fips }
    - { name: fips.lib,   flags: fips_sdk }
    - { name: fips.pdb,   flags: fips_sdk }
    - { name: legacy.dll, flags: all }
    - { name: legacy.lib, flags: sdk }
    - { name: legacy.pdb, flags: sdk }
  "html/man1":
    - { name: openssl.html, flags: sdk }
  "html/man3":
    - { name: EVP_PKEY_new.html, flags: sdk }
  "html/man5":
    - { name: config.html, flags: sdk }
  "html/man7":
    - { name: EVP_RAND.html, flags: sdk }
  "include/openssl":
    - { name: evp.h, flags: sdk }
  "config":
    - { name: ct_log_list.cnf,      flags: all }
    - { name: ct_log_list.cnf.dist, flags: all }
    - { name: openssl.cnf,          flags: all }
    - { name: openssl.cnf.dist,     flags: all }
    - { name: fipsmodule.cnf,       flags: fips }

# Files that must remain after uninstall (user-preserved config).
post_uninstall_keep:
  "config":
    - openssl.cnf
    - ct_log_list.cnf

# Expectations for a signed installer artifact. Used by tests marked
# `signed`, which are skipped by default and only run when explicitly
# selected.
signing:
  # Substring expected (case-insensitive) in the SignerCertificate.Subject
  # of a signed build. Update this if the signing certificate changes.
  publisher_subject_cn: "OpenSSL Software Services Czech, s.r.o."
  # If true, the signature must include an RFC 3161 timestamp.
  timestamp_required: true
