name: Test Installer

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Internal: openssl-ci-bot PR number. Leave empty for a normal manual run.'
        required: false
        type: string
      head_sha:
        description: 'Internal: openssl-ci-bot commit SHA. Leave empty for a normal manual run.'
        required: false
        type: string
      check_run_id:
        description: 'Internal: openssl-ci-bot check-run ID. Leave empty for a normal manual run.'
        required: false
        type: string
      selection:
        description: 'Internal: openssl-ci-bot normalised /ci selection.'
        required: false
        type: string
      fips:
        description: 'Internal: openssl-ci-bot FIPS module matrix (JSON strategy.matrix).'
        required: false
        type: string
      build:
        description: 'Internal: openssl-ci-bot installer build matrix (JSON strategy.matrix).'
        required: false
        type: string
      test:
        description: 'Internal: openssl-ci-bot install test matrix (JSON strategy.matrix).'
        required: false
        type: string

run-name: >-
  ${{ inputs.pr && format('ci-dispatch pr={0} head={1} check_run_id={2}', inputs.pr, inputs.head_sha, inputs.check_run_id) || github.workflow }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr && format('pr-{0}-{1}', inputs.pr, inputs.selection) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The NIST-validated FIPS module is built once per architecture from this ref
  # and shared by every installer flavor of that architecture via the `fips`
  # job's artifact.
  FIPS_REF: openssl-3.1.2

# Visual Studio Enterprise and Perl are preinstalled on the hosted Windows
# runners, but the VS version and path differ between images (VS 2026 under
# "Microsoft Visual Studio\18" on windows-2025, VS 2022 17.14 with the
# VC.Tools.ARM64 component under "Microsoft Visual Studio\2022" on
# windows-11-arm, see actions/runner-images' Windows11-Arm64-Readme.md), so
# each job locates it with vswhere (the "Locate Visual Studio" steps) and picks
# the vcvars script for its target architecture.
jobs:
  plan:
    name: Plan matrices
    # A fork's pull request runs only through a writer's openssl-ci-bot `/ci`. A head branch
    # in this repo took write access to push, so its pull request runs here; every other job
    # needs this one, so skipping it skips the run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      fips: ${{ steps.plan.outputs.fips }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Read default matrices
        id: plan
        run: |
          for kind in fips build test; do
            echo "$kind=$(jq -c --arg kind "$kind" '.[$kind]' .github/ci-matrix.json)" >> "$GITHUB_OUTPUT"
          done

  fips:
    name: "Build FIPS module (${{ matrix.arch }})"
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.pr && inputs.fips || needs.plan.outputs.fips) }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Restore FIPS build cache
        id: fips_cache
        uses: actions/cache/restore@v5
        with:
          path: openssl-fips
          key: openssl-fips-${{ runner.os }}-${{ matrix.arch }}-${{ env.FIPS_REF }}-v1

      - name: Checkout OpenSSL for FIPS (${{ env.FIPS_REF }})
        if: steps.fips_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: openssl/openssl
          ref: ${{ env.FIPS_REF }}
          path: openssl-fips
          persist-credentials: false

      - name: Apply Windows build patches to FIPS source
        if: steps.fips_cache.outputs.cache-hit != 'true' && env.FIPS_REF == 'openssl-3.1.2'
        shell: pwsh
        working-directory: openssl-fips
        run: |
          git apply --verbose "$env:GITHUB_WORKSPACE\windows-installer\0001-win-Fix-warning-build-issue.patch"
          if ($LASTEXITCODE -ne 0) { throw "patch 0001 failed" }
          git apply --verbose "$env:GITHUB_WORKSPACE\windows-installer\0002-windows-makefile-libdir-absolute.patch"
          if ($LASTEXITCODE -ne 0) { throw "patch 0002 failed" }
          git apply --verbose "$env:GITHUB_WORKSPACE\windows-installer\0001-3.1-Windows-Use-Z7-compiler-flag-to-enable-parallel-.patch"
          if ($LASTEXITCODE -ne 0) { throw "jom patch failed" }

      - name: Locate Visual Studio
        if: steps.fips_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $script = "${{ matrix.vcvars }}".Split(' ') |
              ForEach-Object { Join-Path $vs "VC\Auxiliary\Build\$_" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          if (-not $script) { throw "none of '${{ matrix.vcvars }}' found under $vs\VC\Auxiliary\Build" }
          Write-Host "using $script"
          "VCVARS=$script" >> $env:GITHUB_ENV

      - name: install nasm
        # x86-only assembler; the ARM64 target assembles with MSVC's armasm64.
        if: steps.fips_cache.outputs.cache-hit != 'true' && matrix.arch != 'arm64'
        shell: pwsh
        run: |
          $installer = "nasm-3.01-installer-x64.exe"
          Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/$installer" -OutFile $installer
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).$installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for $installer (expected $expected, got $actual)" }
          Start-Process -FilePath ".\$installer" -ArgumentList '/S' -Wait
          "C:\Program Files\NASM" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: install jom
        if: steps.fips_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          mkdir C:\jom
          Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/jom-1.1.7.exe" -OutFile C:\jom\jom.exe
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).'jom-1.1.7.exe'
          $actual = (Get-FileHash C:\jom\jom.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for jom.exe (expected $expected, got $actual)" }
          "C:\jom" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Build FIPS module (${{ matrix.target }})
        if: steps.fips_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: openssl-fips
        run: |
          call "%VCVARS%"
          perl Configure ${{ matrix.target }} enable-fips no-makedepend
          jom /j4 /S

      - name: Save FIPS build cache
        if: steps.fips_cache.outputs.cache-hit != 'true' && inputs.pr == ''
        uses: actions/cache/save@v5
        with:
          path: openssl-fips
          key: ${{ steps.fips_cache.outputs.cache-primary-key }}

      - name: Upload FIPS providers
        uses: actions/upload-artifact@v4
        with:
          name: openssl-fips-providers-${{ matrix.arch }}
          path: |
            openssl-fips/providers/fips.dll
            openssl-fips/providers/fips.lib
            openssl-fips/providers/fips.pdb
          if-no-files-found: error

  build:
    name: "Build ${{ matrix.crt.arch }} ${{ matrix.crt.flavor }} installers (${{ matrix.openssl-ref }})"
    needs: [plan, fips]
    runs-on: ${{ matrix.crt.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.pr && inputs.build || needs.plan.outputs.build) }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Checkout OpenSSL (${{ matrix.openssl-ref }})
        uses: actions/checkout@v7
        with:
          repository: openssl/openssl
          ref: ${{ matrix.openssl-ref }}
          path: openssl
          fetch-tags: true
          persist-credentials: false

      - name: Detect OpenSSL version from latest tag
        id: openssl_version
        shell: pwsh
        working-directory: openssl
        run: |
          # Pick the highest tag in this branch's family; versionsort.suffix
          # ranks pre-releases (-alpha1, -beta1) below the final release.
          $pattern = '${{ matrix.openssl-ref }}.*'
          $tag = git -c versionsort.suffix=- tag --list $pattern --sort=-version:refname | Select-Object -First 1
          if (-not $tag) {
              throw "no tags matching '$pattern' found in the openssl checkout"
          }
          $version = $tag -replace '^openssl-', ''
          # The installer version is numeric: remove "-beta1", "-dev" and such
          $version = $version.Split('-')[0]
          $parts = $version.Split('.')
          if ($parts.Count -lt 3) { throw "unexpected tag format: $tag" }
          Write-Host "detected version: $version (from tag $tag)"
          "tag=$tag"                                          >> $env:GITHUB_OUTPUT
          "version=$version"                                  >> $env:GITHUB_OUTPUT
          "major=$($parts[0])"                                >> $env:GITHUB_OUTPUT
          "minor=$($parts[1])"                                >> $env:GITHUB_OUTPUT
          "winctx=$($parts[0]).$($parts[1])-OpenSSLProject"   >> $env:GITHUB_OUTPUT

      - name: Check out detected tag
        shell: cmd
        working-directory: openssl
        run: git -c advice.detachedHead=false checkout tags/${{ steps.openssl_version.outputs.tag }}

      - name: Restore OpenSSL build cache
        id: openssl_cache
        uses: actions/cache/restore@v5
        with:
          path: openssl
          key: openssl-build-${{ runner.os }}-${{ matrix.crt.arch }}-${{ matrix.crt.flavor }}-${{ steps.openssl_version.outputs.tag }}-v1

      - name: Locate Visual Studio
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $script = "${{ matrix.crt.vcvars }}".Split(' ') |
              ForEach-Object { Join-Path $vs "VC\Auxiliary\Build\$_" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          if (-not $script) { throw "none of '${{ matrix.crt.vcvars }}' found under $vs\VC\Auxiliary\Build" }
          Write-Host "using $script"
          "VCVARS=$script" >> $env:GITHUB_ENV

      - name: install nasm
        # x86-only assembler; the ARM64 target assembles with MSVC's armasm64.
        if: steps.openssl_cache.outputs.cache-hit != 'true' && matrix.crt.arch != 'arm64'
        shell: pwsh
        run: |
          $installer = "nasm-3.01-installer-x64.exe"
          Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/$installer" -OutFile $installer
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).$installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for $installer (expected $expected, got $actual)" }
          Start-Process -FilePath ".\$installer" -ArgumentList '/S' -Wait
          "C:\Program Files\NASM" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: install jom
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          mkdir C:\jom
          Invoke-WebRequest -Uri "https://openssl-library.org/ci-deps/jom-1.1.7.exe" -OutFile C:\jom\jom.exe
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\.github\ci-deps.json" -Raw | ConvertFrom-Json).'jom-1.1.7.exe'
          $actual = (Get-FileHash C:\jom\jom.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "SHA256 mismatch for jom.exe (expected $expected, got $actual)" }
          "C:\jom" | Out-File -FilePath "$env:GITHUB_PATH" -Append

      - name: Build OpenSSL (${{ matrix.crt.target }})
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: openssl
        run: |
          call "%VCVARS%"
          perl Configure ${{ matrix.crt.target }} enable-fips no-makedepend -DOSSL_WINCTX=OpenSSLProject
          jom /j4 /S
          jom build_docs

      - name: Save OpenSSL build cache
        if: steps.openssl_cache.outputs.cache-hit != 'true' && inputs.pr == ''
        uses: actions/cache/save@v5
        with:
          path: openssl
          key: ${{ steps.openssl_cache.outputs.cache-primary-key }}

      - name: Download FIPS providers
        uses: actions/download-artifact@v4
        with:
          name: openssl-fips-providers-${{ matrix.crt.arch }}
          path: openssl-fips/providers

      - name: Build installers
        # Advanced Installer is an x86 application; on the arm64 runner it runs under emulation.
        uses: caphyon/advinst-github-action@7edde34c6ff935e53e3de72a5699efcfceb5f6c6  # v2.0.3 (current main HEAD)
        with:
          advinst-version: '23.8'
          advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}
          advinst-enable-automation: 'true'
          aip-path: ${{ github.workspace }}\windows-installer\openssl.aip
          aip-build-name: ${{ matrix.crt.msi_build }}
          aip-commands: |
            ResetSig
            SetVersion ${{ steps.openssl_version.outputs.version }}
            SetProperty VERSION_MAJOR=${{ steps.openssl_version.outputs.major }}
            SetProperty VERSION_MINOR=${{ steps.openssl_version.outputs.minor }}
            SetProperty VERSION_REGISTRY=${{ steps.openssl_version.outputs.winctx }}
            Build -buildslist ${{ matrix.crt.exe_build }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.crt.arch }}-${{ matrix.crt.flavor }}-${{ matrix.openssl-ref }}
          path: |
            build-target/Installer64/${{ matrix.crt.package }}.exe
            build-target/Installer64/${{ matrix.crt.package }}.msi
          if-no-files-found: error

  test:
    name: "Test ${{ matrix.package }}.${{ matrix.format }} on ${{ matrix.os }}${{ inputs.pr && format(' ({0})', matrix.openssl-ref) || '' }}"
    needs: [plan, build]
    if: inputs.pr == '' || inputs.test != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.pr && inputs.test || needs.plan.outputs.test) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*-${{ matrix.openssl-ref }}
          path: build
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3 (= release v3.2.4)
        with:
          enable-cache: ${{ inputs.pr == '' }}
          cache-dependency-glob: "" # disables lockfile requirement

      # On the arm64 runner uv would otherwise pick an x86_64 CPython that runs
      # under emulation, and the tests would drive Windows Installer from an
      # emulated process. Use the image's native arm64 Python instead.
      - name: Set up native arm64 Python
        if: matrix.os == 'windows-11-arm'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Use native arm64 Python for uv
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $python = Join-Path $env:pythonLocation "python.exe"
          & $python -c "import platform, sys; print(sys.executable, platform.machine())"
          "UV_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Install Python deps
        run: uv sync --frozen || uv sync

      - name: Select installer under test
        id: installer
        shell: pwsh
        run: |
          $pattern = '${{ matrix.package }}.${{ matrix.format }}'
          $file = Get-ChildItem build -Recurse -File |
              Where-Object { $_.Name -like $pattern } |
              Select-Object -First 1
          if (-not $file) { throw "No installer matching '$pattern' found in build/" }
          $mb = [math]::Round($file.Length / 1MB, 2)
          Write-Host "Testing installer: $($file.Name) ($mb MB)"
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run pytest
        run: uv run pytest tests --installer "${{ steps.installer.outputs.path }}" -v
