[project]
name = "openssl-installer-tests"
version = "0.1.0"
description = "Test suite for the OpenSSL Windows installer"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
    "requests>=2.31",
    "pywinauto>=0.6",
    "pillow>=10",
    # PE import-table inspection (CRT-flavor check in test_silent_install.py).
    "pefile>=2023.2.7",
    # WindowsInstaller.Installer COM automation for MSI table introspection
    # (FIPS-disable-in-hybrid check). Also pulled in transitively by pywinauto;
    # declared explicitly and gated to Windows (no Linux wheels).
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.mypy]
python_version = "3.11"
# Platform=win32 so mypy can resolve `import winreg` when run on Linux dev boxes.
platform = "win32"

[[tool.mypy.overrides]]
module = ["pywinauto", "pywinauto.*", "pefile", "win32com", "win32com.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "signed: requires a signed installer artifact",
    "fips: exercises FIPS provider behavior",
    "gui: requires an interactive desktop session",
    "upgrade: requires multiple MSI versions (TODO)",
    "destructive: temporarily removes system dependencies (e.g., VC++ runtime)",
]
addopts = "-m 'not signed and not destructive'"
filterwarnings = [
    # pywinauto echoes our intentional sys.coinit_flags=0 (MTA apartment).
    "ignore:Apply externally defined coinit_flags.*:UserWarning",
]
